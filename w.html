<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YOU OS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F2EC">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Newsreader:ital,opsz,wght@1,6..72,300&display=swap" rel="stylesheet">
<style>
  /* Hit skickar Oura, Whoop och Polar tillbaka efter att hon godkänt. Sidan lämnar koden vidare till appen. Samma stil som inbjudan (k.html). */
  :root { --bg:#F6F2EC; --raised:#FFFDFA; --line:#E4DACD; --text:#4A4038; --soft:#8F8780; --auraStrong:#D8B291; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  .glow { position:fixed; left:50%; top:34%; width:900px; height:900px; transform:translate(-50%,-50%); border-radius:50%;
          background:radial-gradient(circle, rgba(226,200,176,.55) 0%, rgba(226,200,176,.18) 38%, rgba(246,242,236,0) 68%);
          animation:glow 9s ease-in-out infinite; pointer-events:none; z-index:0; }
  @keyframes glow { 0%,100% { opacity:.75; transform:translate(-50%,-50%) scale(1); } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.06); } }
  main { position:relative; z-index:1; max-width:520px; margin:0 auto; padding:max(48px, env(safe-area-inset-top)) 24px 40px; min-height:100%;
         display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .brand { font-size:13px; letter-spacing:.32em; color:var(--soft); margin:0; }
  .pebble { width:128px; height:128px; margin:40px 0 32px; animation:breathe 6s ease-in-out infinite; filter:drop-shadow(0 30px 50px rgba(184,150,120,.35)); }
  .pebble img { width:100%; height:100%; display:block; }
  @keyframes breathe { 0%,100% { transform:scale(1) translateY(0); } 50% { transform:scale(1.04) translateY(-4px); } }
  h1 { font-weight:300; font-size:34px; line-height:1.1; letter-spacing:-.03em; margin:0; text-wrap:balance; }
  h1 em { display:block; font-family:'Newsreader',Georgia,serif; font-style:italic; font-weight:300; font-size:40px; line-height:1.1; letter-spacing:-.02em; color:#9C7E62; margin-top:6px; }
  .btn { display:flex; align-items:center; justify-content:center; width:100%; height:56px; margin-top:36px; border:0; border-radius:999px; background:var(--text); color:var(--raised);
         font:inherit; font-size:16px; font-weight:500; text-decoration:none; box-shadow:0 10px 34px rgba(74,64,56,.22); }
  .fine { font-size:13px; color:var(--soft); margin:14px 0 0; }
  .rise { opacity:0; transform:translateY(10px); animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .d2 { animation-delay:.3s; } .d3 { animation-delay:.9s; }
  @keyframes rise { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .glow, .pebble { animation:none; } .rise { animation:none; opacity:1; transform:none; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <p class="brand">YOU OS</p>
  <div class="pebble" aria-hidden="true"><img src="pebble.png" alt=""></div>
  <h1 class="rise d2" id="title">Kopplar ihop.<em>Ett ögonblick.</em></h1>
  <a class="btn rise d3" id="open" href="#">Tillbaka till YOU OS</a>
  <p class="fine rise d3">Öppnas inte appen? Tryck på knappen.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const out = new URLSearchParams();
  ['code', 'state', 'error'].forEach((k) => { if (q.get(k)) out.set(k, q.get(k)); });
  const url = 'youos://wearable?' + out.toString();
  document.getElementById('open').href = url;
  if (q.get('error')) document.getElementById('title').innerHTML = 'Inget kopplades.<em>Du kan försöka igen.</em>';
  location.replace(url);
</script>
</body>
</html>
